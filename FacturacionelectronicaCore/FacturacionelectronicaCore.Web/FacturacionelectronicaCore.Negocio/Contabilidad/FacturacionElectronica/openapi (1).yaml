---
openapi: 3.0.3
info:
  title: API Celeste
  version: 1.0.0
  description: |
    API Celeste es la plataforma de integración que permite a aplicaciones externas
    conectarse con los servicios de Celeste para ejecutar operaciones de autenticación,
    intercambio de información e integración con diferentes procesos empresariales.

    Esta documentación describe los pasos necesarios para registrar una aplicación,
    autenticarse y ejecutar operaciones dentro del ecosistema Celeste.
servers:
- url: https://api.celestefacturacion.com
  description: API pública de producción
tags:
- name: Autenticación
  description: |
    Operaciones relacionadas con la generación de token de acceso.

    ## Credenciales de acceso

    Para obtener las credenciales necesarias (**client-id** y **user-token**), tanto en el ambiente de pruebas como en el ambiente de producción, debe comunicarse con el área de soporte de Celeste.

    Estas credenciales son necesarias para generar el token de acceso y consumir los endpoints protegidos de la API.
- name: Factura electrónica de venta
  description: Operaciones para registrar y consultar facturas electrónicas de venta.
- name: Productos
  description: Operaciones para crear y consultar productos disponibles en Celeste.
- name: Pedido de venta
  description: Operaciones para registrar y consultar pedidos de venta.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Bearer Token
  schemas:
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: nit
        message:
          type: string
          example: El campo nit solo debe contener números.
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: La solicitud contiene campos inválidos o no permitidos.
        details:
          type: array
          items:
            "$ref": "#/components/schemas/ErrorDetail"
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
          example: 40
        status:
          type: string
          example: Bad Request
        message:
          type: string
          example: Los campos client-id, user-token y nit son obligatorios
        data:
          type: string
          example: ''
    AuthRequest:
      type: object
      required:
      - client-id
      - nit
      - user-token
      properties:
        client-id:
          type: string
          format: uuid
          description: Identificador único del cliente asignado por Celeste. Debe
            ser un UUID válido.
          example: 8f0d1a6b-2e43-4e2f-9a7b-6c15d83f2a91
        nit:
          type: string
          description: NIT de la empresa. Solo se permiten números.
          example: '2222222222'
        user-token:
          type: string
          description: Token de usuario asignado por Celeste para la autenticación
            de la empresa.
          example: a9f4c1e7b8d2036f5a91c0b2e4d7f863
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        code:
          type: integer
          example: 20
        status:
          type: string
          example: OK
        message:
          type: string
          example: OK
        data:
          type: object
          properties:
            token:
              type: string
              description: Token JWT generado para consumir los endpoints protegidos
                de la API.
              example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJDZWxlc3RlQVBJIiwiZXhwIjoxNzY2ODAwMDAwfQ.sandbox_signature_example
            empresa_id:
              type: integer
              example: 620
            expiracion:
              type: string
              format: date-time
              description: Fecha y hora de expiración del token. La vigencia del token
                es de 24 horas.
              example: '2026-04-28T08:43:03.358'
    Anotacion:
      type: object
      properties:
        note:
          type: string
          example: 'Placa: VSF145, Kilometraje : null, Nro Transaccion : '
    FormaPago:
      type: object
      required:
      - forma_pago_dian
      - valor
      properties:
        forma_pago_dian:
          type: string
          description: Forma de pago DIAN. 1 = contado/efectivo, 2 = crédito.
          example: '1'
        medio_pago_dian_codigo:
          type: string
          description: 'Código DIAN del medio de pago. Ejemplos: 11 = efectivo, 47
            = transferencia, 50 = tarjeta crédito, 49 = tarjeta débito. Es obligatorio
            cuando forma_pago_dian = 1 y se desea especificar el medio de pago.'
          example: '11'
        numero_cuenta:
          type: string
          description: Número de cuenta. Obligatorio para pagos por transferencia;
            debe corresponder a una cuenta registrada y activa en Celeste.
          example: '7777777'
        numero_transaccion:
          type: string
          description: Número o referencia de la transacción. Obligatorio para pagos
            por transferencia.
          example: dfff0123456
        franquicia_tarjeta:
          type: string
          description: Franquicia de la tarjeta. Obligatorio para pagos con tarjeta
            crédito o débito.
          example: MASTER CARD
        ultimos_digitos:
          type: string
          description: Últimos 4 dígitos de la tarjeta. Obligatorio para pagos con
            tarjeta crédito o débito.
          example: '1234'
        valor:
          type: string
          description: Valor pagado por este medio de pago.
          example: '20000.00'
    TerceroReceptor:
      type: object
      required:
      - nit
      - juridico
      - tipo_identificacion_dian
      - email
      - direccion
      - codigo_pais
      - codigo_departamento
      - codigo_municipio
      properties:
        nit:
          type: string
          description: Identificación del receptor. Obligatorio, sin puntos ni dígito
            de verificación. Si tipo_identificacion_dian es 42, 47 o 50, o si corresponde
            a un extranjero, se permite un valor alfanumérico.
          example: '900795393'
        juridico:
          type: string
          description: Indica si el tercero receptor es jurídico. Obligatorio. Use
            true para persona jurídica y false para persona natural.
          example: 'true'
        tipo_identificacion_dian:
          type: string
          description: Tipo de identificación DIAN del receptor. Obligatorio.
          example: '31'
        nombre:
          type: string
          description: Primer nombre del receptor. Obligatorio cuando juridico = false.
          example: ''
        nombre2:
          type: string
          description: Segundo nombre del receptor. Opcional.
          example: ''
        apellido:
          type: string
          description: Primer apellido del receptor. Obligatorio cuando juridico =
            false.
          example: ''
        apellido2:
          type: string
          description: Segundo apellido del receptor. Opcional.
          example: ''
        razon_social:
          type: string
          description: Razón social del receptor. Obligatorio cuando juridico = true.
          example: Distribuciones la pepita
        nombre_empresa:
          type: string
          description: Nombre comercial de la empresa o negocio. Opcional.
          example: tienda la pepita
        email:
          type: string
          format: email
          description: Correo electrónico del receptor. Obligatorio.
          example: notiene@notiene.com.co
        telefono:
          type: string
          description: Teléfono del receptor. Obligatorio si no se informa celular.
          example: ''
        celular:
          type: string
          description: Celular del receptor. Obligatorio si no se informa teléfono.
          example: '3156128040'
        direccion:
          type: string
          description: Dirección del receptor. Obligatorio.
          example: CL 4 4-82
        codigo_pais:
          type: string
          description: Código de país DIAN. Obligatorio.
          example: CO
        codigo_departamento:
          type: string
          description: Código DANE del departamento. Obligatorio.
          example: '76'
        codigo_municipio:
          type: string
          description: Código DANE del municipio. Obligatorio.
          example: '001'
    Descuento:
      type: object
      description: Objeto de descuento. Es obligatorio cuando producto_gratuito =
        true. Cuando producto_gratuito = false. Si no existe un valor de descuento no se debe enviar.
      properties:
        porcentaje_descuento:
          type: string
          description: Porcentaje de descuento con hasta 6 decimales. Si se envían
            porcentaje_descuento y valor_descuento, se da prioridad al porcentaje.
            Debe ser 100 cuando producto_gratuito = true.
          example: '0'
        valor_descuento:
          type: string
          description: Valor del descuento en moneda, con impuestos incluidos. Si
            se envía junto con porcentaje_descuento, se da prioridad al porcentaje.
          example: '0'
        valor_base_descuento:
          type: string
          description: Base sobre la cual se aplica el descuento. Obligatorio cuando
            producto_gratuito = true.
          example: ''
    ProductoFacturaVenta:
      type: object
      required:
      - producto_codigo
      - cantidad
      - subtotal
      - producto_gratuito
      properties:
        producto_codigo:
          type: string
          description: Código del producto. Obligatorio. El producto debe estar registrado
            en Celeste.
          example: '20116'
        unidad_medida:
          type: string
          description: Unidad de medida. Obligatorio si la empresa trabaja con presentaciones.
          example: Libra
        cantidad:
          type: string
          description: Cantidad vendida. Obligatorio. Puede tener hasta 6 decimales.
          example: '1'
        valor_unitario_final:
          type: string
          description: Valor unitario final con impuestos incluidos. Opcional. Si
            se envía, se respeta y no se recalcula. Si producto_gratuito = true, debe
            ser cero.
          example: '10000'
        subtotal:
          type: string
          description: Total por fila con impuestos incluidos y descuento aplicado.
            Obligatorio. Corresponde al valor unitario por la cantidad, redondeado
            a dos decimales para factura nacional. Si producto_gratuito = true, debe
            ser cero.
          example: '20000'
        descripcion:
          type: string
          description: Descripción del producto. Opcional.
          example: gl Corriente
        producto_gratuito:
          type: string
          description: Indica si el producto es gratuito. Obligatorio. Si es true,
            el porcentaje de descuento debe ser 100 y los valores del producto deben
            quedar sin valor/cero según corresponda.
          example: 'false'
        descuento:
          "$ref": "#/components/schemas/Descuento"
    DatosGeneralesDocumento:
      type: object
      required:
      - nit_tercero_emisor
      - hora_generacion
      - fecha_generacion
      - fecha_vencimiento
      - valor_total
      - contingencia
      properties:
        nit_tercero_emisor:
          type: string
          description: NIT del tercero emisor. Obligatorio, sin puntos ni dígito de
            verificación.
          example: '7777777777'
        tipo_moneda:
          type: string
          description: Código de moneda. Por defecto COP. Solo es necesario enviarlo
            para factura de exportación.
          default: COP
          example: COP
        hora_generacion:
          type: string
          description: Hora de generación del documento en formato HH:mm:ss.
          example: '10:48:24'
        fecha_generacion:
          type: string
          format: date
          description: Fecha de generación del documento.
          example: '2026-04-29'
        fecha_vencimiento:
          type: string
          format: date
          description: Fecha de vencimiento del documento.
          example: '2026-04-21'
        gen_uuid:
          type: string
          description: UUID opcional para trazabilidad de consultas. Aunque es opcional,
            se recomienda enviarlo para poder consultar y rastrear posteriormente
            el documento. Si no se envía, el sistema genera uno automáticamente.
          example: 554bde42-d5dd-4594-a18c-5c1ca7035797
        observaciones:
          type: string
          description: Observaciones generales del documento. Opcional.
          example: esta es la observacion del documento para prueba
        valor_total:
          type: string
          description: Valor total del documento con impuestos incluidos.
          example: '40000'
        contingencia:
          type: string
          description: Indica si la factura se genera en modo contingencia.
          example: 'false'
    DocumentoFacturaVenta:
      type: object
      required:
      - datos_generales_documento
      - tercero_receptor
      - descripcion_productos
      - formas_pago
      properties:
        datos_generales_documento:
          "$ref": "#/components/schemas/DatosGeneralesDocumento"
        tercero_receptor:
          "$ref": "#/components/schemas/TerceroReceptor"
        descripcion_productos:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/ProductoFacturaVenta"
        formas_pago:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/FormaPago"
    FacturaVentaRequest:
      type: object
      required:
      - documento
      properties:
        documento:
          "$ref": "#/components/schemas/DocumentoFacturaVenta"
    FacturaVentaResponse:
      type: object
      properties:
        statusHttp:
          type: integer
          example: 200
        response:
          type: object
          properties:
            success:
              type: boolean
              example: true
            code:
              type: integer
              example: 20
            status:
              type: string
              example: OK
            message:
              type: string
              example: Proceso Terminado
            data:
              type: object
              properties:
                numero_factura:
                  type: string
                  example: SETP 994001065
                fecha_factura:
                  type: string
                  format: date
                  example: '2026-04-29'
                gen_uuid:
                  type: string
                  format: uuid
                  example: df1d4353-8381-443d-87ea-5a53bea4328a
                contingencia:
                  type: string
                  example: 'false'
    ConsultaFacturaVentaResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Factura consultada correctamente.
        data:
          type: object
          properties:
            numero_factura:
              type: integer
              example: 6750
            fecha_factura:
              type: string
              format: date
              example: '2026-02-07'
            estado:
              type: string
              example: aprobada
            attached_document:
              type: string
              description: codificado en base64
              example: JVBERi0xLjUKJeLjz9MKMyAwIG9iago8PC9Db2xvclNwYWNlL...
    DatosGeneralesPedidoVenta:
      type: object
      required:
      - nit_tercero_emisor
      - hora_generacion
      - fecha_generacion
      - fecha_vencimiento
      - valor_total
      properties:
        nit_tercero_emisor:
          type: string
          description: NIT del tercero emisor. Obligatorio, sin puntos ni dígito de
            verificación.
          example: '7777777777'
        hora_generacion:
          type: string
          description: Hora de generación del pedido en formato HH:mm:ss.
          example: '10:48:24'
        fecha_generacion:
          type: string
          format: date
          description: Fecha de generación del pedido.
          example: '2026-04-29'
        fecha_vencimiento:
          type: string
          format: date
          description: Fecha de vencimiento del pedido.
          example: '2026-04-21'
        gen_uuid:
          type: string
          description: UUID opcional para trazabilidad de consultas. Aunque es opcional,
            se recomienda enviarlo para poder consultar y rastrear posteriormente
            el pedido. Si no se envía, el sistema genera uno automáticamente.
          example: 554bde42-d5dd-4594-a18c-5c1ca7035797
        observaciones:
          type: string
          description: Observaciones generales del pedido. Opcional.
          example: esta es la observacion del documento para prueba
        valor_total:
          type: string
          description: Valor total del pedido con impuestos incluidos.
          example: '40000'
    ProductoPedidoVenta:
      type: object
      required:
      - producto_codigo
      - cantidad
      - subtotal
      - producto_gratuito
      properties:
        producto_codigo:
          type: string
          description: Código del producto. Obligatorio. El producto debe estar registrado
            en Celeste.
          example: '20213'
        unidad_medida:
          type: string
          description: Unidad de medida. Obligatorio si la empresa trabaja con presentaciones.
          example: Libra
        cantidad:
          type: string
          description: Cantidad vendida. Obligatorio. Puede tener hasta 6 decimales.
          example: '1'
        valor_unitario_final:
          type: string
          description: Valor unitario final con impuestos incluidos. Opcional. Si
            se envía, se respeta y no se recalcula. Si producto_gratuito = true, debe
            ser cero.
          example: '10000'
        subtotal:
          type: string
          description: Total por fila con impuestos incluidos y descuento aplicado.
            Obligatorio. Corresponde al valor unitario por la cantidad, redondeado
            a dos decimales para pedido nacional. Si producto_gratuito = true, debe
            ser cero.
          example: '20000'
        descripcion:
          type: string
          description: Descripción del producto. Opcional.
          example: gl Corriente
        producto_gratuito:
          type: string
          description: Indica si el producto es gratuito. Obligatorio. Si es true,
            el porcentaje de descuento debe ser 100 y los valores del producto deben
            quedar sin valor/cero según corresponda.
          example: 'false'
        descuento:
          "$ref": "#/components/schemas/Descuento"
    DocumentoPedidoVenta:
      type: object
      required:
      - datos_generales_documento
      - tercero_receptor
      - descripcion_productos
      properties:
        datos_generales_documento:
          "$ref": "#/components/schemas/DatosGeneralesPedidoVenta"
        tercero_receptor:
          "$ref": "#/components/schemas/TerceroReceptor"
        descripcion_productos:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/ProductoPedidoVenta"
    PedidoVentaRequest:
      type: object
      required:
      - documento
      properties:
        documento:
          "$ref": "#/components/schemas/DocumentoPedidoVenta"
    PedidoVentaResponse:
      type: object
      properties:
        statusHttp:
          type: integer
          example: 200
        response:
          type: object
          properties:
            success:
              type: boolean
              example: true
            code:
              type: integer
              example: 20
            status:
              type: string
              example: OK
            message:
              type: string
              example: Proceso Terminado
            data:
              type: object
              properties:
                numero_pedido:
                  type: string
                  example: PED 994001065
                fecha_pedido:
                  type: string
                  format: date
                  example: '2026-04-29'
                gen_uuid:
                  type: string
                  format: uuid
                  example: df1d4353-8381-443d-87ea-5a53bea4328a
    ConsultaPedidoVentaResponse:
      type: object
      properties:
        statusHttp:
          type: integer
          example: 200
        response:
          type: object
          properties:
            success:
              type: boolean
              example: true
            code:
              type: integer
              example: 20
            status:
              type: string
              example: OK
            message:
              type: string
              example: OK
            data:
              type: object
              properties:
                numero_pedido:
                  type: string
                  description: Número asignado al pedido de venta.
                  example: PED 994001067
                estado:
                  type: integer
                  description: 'Estado del pedido: 0 = aprobado, 1 = pendiente, 2
                    = rechazado.'
                  enum:
                  - 0
                  - 1
                  - 2
                  example: 1
                fecha_pedido:
                  type: string
                  format: date-time
                  description: Fecha y hora registrada para el pedido.
                  example: '2026-04-29T22:11:17.594010'
paths:
  "/webhook/api/auth":
    post:
      tags:
      - Autenticación
      summary: Generar token de acceso
      description: |
        Genera un token de acceso para consumir los endpoints protegidos de la API.

        Para autenticarse, la empresa debe tener un servicio activo en Celeste.

        El token generado tiene una vigencia de 24 horas. Una vez vencido, se debe solicitar un nuevo token.

        Content-Type requerido: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AuthRequest"
            examples:
              ejemplo:
                summary: Solicitud de token
                value:
                  client-id: 8f0d1a6b-2e43-4e2f-9a7b-6c15d83f2a91
                  nit: '2222222222'
                  user-token: a9f4c1e7b8d2036f5a91c0b2e4d7f863
      responses:
        '200':
          description: Autenticación exitosa y token generado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
              examples:
                ok:
                  summary: Token generado correctamente
                  value:
                    success: true
                    code: 20
                    status: OK
                    message: OK
                    data:
                      token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJDZWxlc3RlQVBJIiwiZXhwIjoxNzY2ODAwMDAwfQ.sandbox_signature_example
                      empresa_id: 620
                      expiracion: '2026-04-28T08:43:03.358'
        '400':
          description: Solicitud incorrecta por campos obligatorios, formato inválido
            o credenciales inválidas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponse"
              examples:
                camposObligatorios:
                  summary: Campos obligatorios faltantes
                  value:
                    success: false
                    code: 40
                    status: Bad Request
                    message: Los campos client-id, user-token y nit son obligatorios
                    data: ''
                clientIdInvalido:
                  summary: client-id inválido
                  value:
                    success: false
                    code: 41
                    status: Bad Request
                    message: 'Error en client-id: Debe ser un UUID válido.'
                    data: ''
                nitInvalido:
                  summary: NIT inválido
                  value:
                    success: false
                    code: 42
                    status: Bad Request
                    message: 'Error en nit: Solo números permitidos.'
                    data: ''
                credencialesInvalidas:
                  summary: Usuario o contraseña inválidos
                  value:
                    success: false
                    code: 43
                    status: Bad Request
                    message: Usuario o contraseña inválidos
                    data: ''
        '409':
          description: Conflicto durante la autenticación o empresa sin servicio activo
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponse"
              examples:
                problemasInicioSesion:
                  summary: Problemas iniciando sesión
                  value:
                    success: false
                    code: 48
                    status: Conflict
                    message: Problemas iniciando sesión. Por favor vuelva a solicitar
                      token.
                    data: ''
                empresaSinServicio:
                  summary: Empresa sin servicio activo
                  value:
                    success: false
                    code: 49
                    status: Conflict
                    message: La empresa no cuenta con un servicio activo en Celeste
                    data: ''
        '415':
          description: Content-Type distinto de application/json
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponse"
              examples:
                unsupportedMediaType:
                  summary: Content-Type no soportado
                  value:
                    success: false
                    code: 45
                    status: Unsupported Media Type
                    message: Esta petición solo acepta Content-Type 'application/json'.
                    data: ''
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponse"
              examples:
                problemasRed:
                  summary: Problemas con la red
                  value:
                    success: false
                    code: 50
                    status: Internal Server Error
                    message: Problemas con la red
                    data: ''
  "/webhook/api/factura_venta":
    post:
      tags:
      - Factura electrónica de venta
      summary: Registrar factura electrónica de venta
      description: |
