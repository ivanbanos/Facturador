    get:
      tags:
      - Factura electrónica de venta
      summary: Consultar factura electrónica de venta
      description: |-
        Consulta una factura electrónica de venta mediante los parámetros `uuid` y `date`.

        Requiere un token válido enviado en el header `Authorization` con el formato: `Bearer <token>`.

        También requiere los headers `X-Celeste-Nit` y `X-Celeste-Client-Id`.

        El parámetro `date` debe enviarse en formato `yyyymmdd`.

        En la respuesta exitosa, el campo `estado` indica el estado de la factura: `0` = aprobada, `1` = pendiente y `2` = rechazada.
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: X-Celeste-Nit
        required: true
        description: NIT de la empresa emisora registrada en Celeste. Debe enviarse
          sin puntos ni dígito de verificación.
        schema:
          type: string
          example: '2222222222'
      - in: header
        name: X-Celeste-Client-Id
        required: true
        description: Client ID asignado por Celeste para la integración.
        schema:
          type: string
          format: uuid
          example: 3f7b2e91-8c4a-4f6d-9b21-6e8a5c0d7f32
      - in: query
        name: uuid
        required: true
        description: UUID de la factura generado o informado al registrar el documento.
        schema:
          type: string
          format: uuid
          example: 8e3c68e7-06d7-4234-a72b-f4d8f8b55f25
      - in: query
        name: date
        required: true
        description: Fecha de generación de la factura en formato yyyymmdd.
        schema:
          type: string
          example: '20260423'
      responses:
        '200':
          description: Factura consultada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusHttp:
                    type: integer
                    example: 200
                  response:
                    type: object
                    properties:
                      success:
                        type: boolean
                      code:
                        type: integer
                      status:
                        type: string
                      message:
                        type: string
                      data:
                        type: object
                        properties:
                          numero_factura:
                            type: string
                            description: Número asignado a la factura electrónica.
                            example: SETP 994001067
                          estado:
                            type: integer
                            description: 'Estado de la factura: 0 = aprobada, 1 =
                              pendiente, 2 = rechazada.'
                            enum:
                            - 0
                            - 1
                            - 2
                            example: 1
                          fecha_factura:
                            type: string
                            format: date-time
                            description: Fecha y hora registrada para la factura.
                            example: '2026-04-29T22:11:17.594010'
                          attached_document:
                            type: string
                            description: Documento adjunto devuelto por la consulta.
                              Cuando exista, se entrega codificado en Base64.
                            example: ''
              examples:
