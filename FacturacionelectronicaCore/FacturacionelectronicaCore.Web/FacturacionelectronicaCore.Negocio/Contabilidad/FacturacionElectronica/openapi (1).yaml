  "/webhook/api/pedido_venta":
    post:
      tags:
      - Pedido de venta
      summary: Registrar pedido de venta
      description: |
        Registra un pedido de venta.

        Requiere un token válido enviado en el header `Authorization` con el formato: `Bearer <token>`.

        También requiere los headers `X-Celeste-Nit` y `X-Celeste-Client-Id`.

        Content-Type requerido: `application/json`.

        El campo `gen_uuid` es opcional, pero se recomienda enviarlo para facilitar la trazabilidad de consultas posteriores.
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: X-Celeste-Nit
        required: true
        description: NIT de la empresa emisora registrada en Celeste. Debe enviarse
          sin puntos ni dígito de verificación.
        schema:
          type: string
          example: '2222222222'
      - in: header
        name: X-Celeste-Client-Id
        required: true
        description: Client ID asignado por Celeste para la integración.
        schema:
          type: string
          format: uuid
          example: 3f7b2e91-8c4a-4f6d-9b21-6e8a5c0d7f32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PedidoVentaRequest"
            examples:
