    get:
      tags:
      - Pedido de venta
      summary: Consultar pedido de venta
      description: |
        Consulta un pedido de venta mediante los parámetros `uuid` y `date`.

        Requiere un token válido enviado en el header `Authorization` con el formato: `Bearer <token>`.

        También requiere los headers `X-Celeste-Nit` y `X-Celeste-Client-Id`.

        El parámetro `date` debe enviarse en formato `yyyymmdd`.

        En la respuesta exitosa, el campo `estado` indica el estado del pedido: `0` = aprobado, `1` = pendiente y `2` = rechazado.
