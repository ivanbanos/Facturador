      - bearerAuth: []
      parameters:
      - in: header
        name: X-Celeste-Nit
        required: true
        description: NIT de la empresa emisora registrada en Celeste. Debe enviarse
          sin puntos ni dígito de verificación.
        schema:
          type: string
          example: '2222222222'
      - in: header
        name: X-Celeste-Client-Id
        required: true
        description: Client ID asignado por Celeste para la integración.
        schema:
          type: string
          format: uuid
          example: 3f7b2e91-8c4a-4f6d-9b21-6e8a5c0d7f32
      - in: query
        name: uuid
        required: true
        description: UUID del pedido generado o informado al registrar el documento.
        schema:
          type: string
          format: uuid
          example: 8e3c68e7-06d7-4234-a72b-f4d8f8b55f25
      - in: query
        name: date
        required: true
        description: Fecha de generación del pedido en formato yyyymmdd.
        schema:
          type: string
          example: '20260429'
